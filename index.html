function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

  }

  g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, 'rgba(90,60,20,0.22)'); p.fillStyle = g; p.fillRect(0, 0, W, H);

// ================= 保存（音のオンオフ・自己ベスト） =================
const store = {

// ================= サウンド =================
let AC = null, NOISE = null, OUT = null, muted = store.get('dp_mute', false);
function audioInit() {

    if (!AC) {
      AC = new (window.AudioContext || window.webkitAudioContext)();
      const b = AC.createBuffer(1, AC.sampleRate * 1.2, AC.sampleRate), d = b.getChannelData(0);
      for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
      NOISE = b;
      OUT = AC.createGain(); OUT.gain.value = 0.8;
      const comp = AC.createDynamicsCompressor(); comp.threshold.value = -14; comp.ratio.value = 4;
      OUT.connect(comp); comp.connect(AC.destination);

}
function toneAt(t, f1, f2, dur, type, vol) {
  const o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(f1, t); if (f2 !== f1) o.frequency.exponentialRampToValueAtTime(Math.max(1, f2), t + dur);
  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.004); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);
  o.connect(g); g.connect(OUT); o.start(t); o.stop(t + dur + 0.03);
}
function noiseAt(t, dur, vol, type, freq) {
  const s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = NOISE; f.type = type; f.frequency.value = freq;
  g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0008, t + dur);

function tone(f1, f2, dur, type = 'sine', vol = 0.15, delay = 0) { if (!AC || muted) return; toneAt(AC.currentTime + delay, f1, f2, dur, type, vol); }
function noise(dur, vol, type = 'lowpass', freq = 1200, delay = 0) { if (!AC || muted || !NOISE) return; noiseAt(AC.currentTime + delay, dur, vol, type, freq); }
// 陽音階（レ・ミ・ソ・ラ・シ）で鳴らす：0=レ3, 5=レ4, 10=レ5 …
const YO = [146.83, 164.81, 196.00, 220.00, 246.94];
const note = d => YO[((d % 5) + 5) % 5] * Math.pow(2, Math.floor(d / 5));
const SFX = {
  hit(j, combo, cl = 0) {
    noise(0.06, 0.2, 'lowpass', 380); // 竹を立てる音
    if (j === 0) { const f = note(5 + combo % 11); tone(f, f, 0.12, 'square', 0.05); tone(f * 2, f * 2, 0.3, 'sine', 0.08, 0.01); noise(0.04, 0.06, 'highpass', 6500); }
    else if (j === 1) { const f = note(5 + combo % 8); tone(f, f, 0.12, 'triangle', 0.1); tone(f * 1.5, f * 1.5, 0.12, 'sine', 0.04, 0.02); }
    else if (j === 2) { tone(520, 470, 0.07, 'triangle', 0.1); noise(0.04, 0.08, 'bandpass', 1200); }

// ================= BGM（和太鼓×電子音。コンボで音が増える） =================
const MEL = [8, -1, 9, 8, 7, -1, 6, 7, 8, -1, 10, 9, 8, 7, 6, -1, 8, -1, 9, 8, 7, 8, 9, -1, 10, -1, 9, 8, 7, 6, 5, -1];

function musicLv() { return G.dopa > 0 || G.phase === 'rush' ? 4 : Math.min(4, 1 + Math.max(tierOf(G.combo), chainLv())); }
function playStep(st, w) {

  if (st < 8) { // カウント（よーい・測れ）
    if (s === 0 || s === 4) { const f = s ? 1175 : 880; toneAt(w, f, f, 0.12, 'square', 0.06); toneAt(w, 140, 42, 0.2, 'sine', 0.5); }

  if (s % 2 === 0) { const f = note(BASSR[bar] + (s % 4 === 2 ? 5 : 0)) / 2; toneAt(w, f, f, 0.14, 'triangle', 0.2); } // ベース
  if (lv >= 2 && (s === 4 || s === 12)) { noiseAt(w, 0.12, 0.2, 'bandpass', 1600); noiseAt(w + 0.012, 0.08, 0.12, 'bandpass', 1250); } // 手拍子
  if (lv >= 2 && s % 2 === 0) { const d = MEL[bar * 8 + s / 2]; if (d >= 0) { const f = note(d); toneAt(w, f, f * 0.996, 0.16, 'sawtooth', 0.04); toneAt(w, f * 2, f * 2, 0.05, 'square', 0.012); } } // 三味線風
  if (lv >= 4) { const f = note([5, 7, 8, 10][s % 4] + BASSR[bar]) * 2; toneAt(w, f, f, 0.06, 'square', 0.025); } // キラキラ
}
function schedMusic() {

  ctx.fillStyle = 'rgba(29,21,48,0.9)'; ctx.fillRect(0, 0, W, 50);
  ctx.save(); ctx.globalAlpha = 0.55 + pulse * 0.45; ctx.fillStyle = dp || tier >= 3 ? rainbow(300) : NEON.pink; ctx.fillRect(0, 50, W, 2 + pulse * 2); ctx.restore();
  const low = G.time < 10 && !G.auto, tcol = low ? '#ff3b3b' : NEON.cyan, tp = low ? 1 + (1 - (G.time % 1)) * 0.15 : 1;
  inkText('のこり', 12, 14, 11, '#cfc6e8', 'left');
  neon(G.time.toFixed(1), 12, 34, 22, tcol, { align: 'left', sc: tp });
  inkText('所持金', W - 12, 14, 11, '#cfc6e8', 'right');
  neon(fmtRyo(G.shown) + '両', W - 12, 34, 20, NEON.yellow, { align: 'right', sc: 1 + G.scoreBump * 0.12 });
  const I = ISL[Math.min(G.isl, ISL.length - 1)];
  inkText(I.name, W / 2 - 8, 16, 15, '#fff');
  inkText(`${Math.min(G.k, NSEG)} / ${NSEG}`, W / 2 - 8, 36, 12, '#cfc6e8', 'center', FN);
  if (G.combo >= 2) {
    neon(`${G.combo} COMBO`, W / 2, 72, 20 + G.comboPop * 6 + tier * 2, dp || tier >= 3 ? rainbow() : [NEON.pink, NEON.pink, NEON.yellow][tier], { rot: -0.03, sc: 1 + pulse * 0.05 });
  }
  if (G.phase === 'rush') { // ラッシュの表示
    const rem = clamp((beatTime(G.rushB1) - now()) / (RUSH_BEATS * G.bLen), 0, 1), rk = Math.min(1, G.rushRi / RUSH_GOAL);
    neon(`${G.rushRi}里`, W / 2, 130, 42, G.rushClear ? rainbow() : NEON.yellow, { sc: 1 + pulse * 0.08 });
    inkText(`/ ${RUSH_GOAL}里`, W / 2 + 70, 142, 14, INK, 'left');
    ctx.fillStyle = 'rgba(29,21,48,0.8)'; rrect(40, 162, W - 80, 12, 6); ctx.fill();
    ctx.fillStyle = G.rushClear ? NEON.green : NEON.pink; rrect(40, 162, Math.max(12, (W - 80) * rk), 12, 6); ctx.fill();
    ctx.fillStyle = 'rgba(29,21,48,0.5)'; ctx.fillRect(40, 180, (W - 80) * rem, 4);
    neon('連打!! 連打!!', W / 2, L.cy + 120, 26, NEON.cyan, { sc: 1 + pulse * 0.15, rot: Math.sin(G.t * 20) * 0.03 });
  }
  // 下：ドパ脳ゲージ
  const gy = L.gY, gx = 64, gw = W - gx - 128;
  ctx.fillStyle = 'rgba(29,21,48,0.9)'; rrect(8, gy - 18, W - 16, 36, 18); ctx.fill();
  ctx.save(); ctx.globalAlpha = 0.3 + pulse * 0.5; ctx.strokeStyle = dp ? rainbow(300) : NEON.cyan; ctx.lineWidth = 1.5; rrect(8, gy - 18, W - 16, 36, 18); ctx.stroke(); ctx.restore();
  inkText(dp ? 'ドパ脳!!' : 'ドパ脳', 18, gy, 12, dp ? NEON.yellow : '#fff', 'left');
  ctx.fillStyle = 'rgba(255,255,255,0.15)'; rrect(gx, gy - 6, gw, 12, 6); ctx.fill();
  const fw = gw * G.gauge / 100 * (dp ? G.dopa / DOPA_N : 1);
  if (fw > 1) {
    ctx.save(); const g = ctx.createLinearGradient(gx, 0, gx + gw, 0);
    if (dp) { const h = (G.t * 300) % 360; for (let i = 0; i <= 4; i++) g.addColorStop(i / 4, `hsl(${(h + i * 72) % 360},100%,60%)`); }
    else { g.addColorStop(0, NEON.pink); g.addColorStop(1, NEON.yellow); }
    ctx.fillStyle = g; ctx.shadowColor = NEON.pink; ctx.shadowBlur = 8; rrect(gx, gy - 6, Math.max(12, fw), 12, 6); ctx.fill(); ctx.restore();
  }
  inkText(`${Math.round(G.dist).toLocaleString()}km`, W - 44, gy, 12, '#fff', 'right', FN);
  if (G.chain >= 2 && G.phase !== 'auto') { // ノンストップの表示
    const cl = chainLv(), col = cl >= 3 ? rainbow(300) : cl >= 2 ? NEON.yellow : NEON.orange, bx = W - 14, by = L.gY - 44;
    inkText('ノンストップ', bx, by - 20, 11, SHU, 'right');
    neon(`${G.chain}連`, bx - (cl ? 42 : 0), by, 22 + G.chainPop * 8, col, { align: 'right', sc: 1 + pulse * 0.06 });
    if (cl) neon(`×${CHAIN_MUL[cl]}`, bx, by + 2, 14, NEON.orange, { align: 'right' });
  }
  drawMute(L.mute.x, L.mute.y);
  // 忠敬の実況
  const x = L.ino.x, y = L.ino.y, e = G.t - G.inoET < Math.max(0.6, (G.inoDur || 0.8) - 0.2) ? G.inoE : dp ? 6 : tier >= 2 ? 1 : 2;
  const sc = 1 + pulse * 0.06 + Math.max(0, 0.2 - (G.t - G.inoET)) * 0.8;
  ctx.save(); ctx.translate(x, y); ctx.scale(sc, sc); drawIno(0, 0, 18, e); ctx.restore();
  if (G.inoTxt && G.t - G.inoTxtT < (G.inoDur || 0.8)) { ctx.font = `13px ${FD}`; const w = Math.min(230, ctx.measureText(G.inoTxt).width + 26); bubble(x + 30, y - 6, w, G.inoTxt, 13, x + 17, y - 2); }
}
function drawMute(mx, my) {
  ctx.save(); ctx.translate(mx, my); ctx.strokeStyle = '#fff'; ctx.fillStyle = '#fff'; ctx.lineWidth = 1.6; ctx.lineCap = 'round';
  ctx.beginPath(); ctx.moveTo(-7, -3); ctx.lineTo(-3, -3); ctx.lineTo(2, -7); ctx.lineTo(2, 7); ctx.lineTo(-3, 3); ctx.lineTo(-7, 3); ctx.closePath(); ctx.fill();
  if (muted) { ctx.beginPath(); ctx.moveTo(5, -4); ctx.lineTo(11, 4); ctx.moveTo(11, -4); ctx.lineTo(5, 4); ctx.stroke(); }
  else { ctx.beginPath(); ctx.arc(3, 0, 5, -0.8, 0.8); ctx.stroke(); ctx.beginPath(); ctx.arc(3, 0, 9, -0.8, 0.8); ctx.stroke(); }
  ctx.restore();
}
function drawPlay() {
  const tier = tierOf(G.combo), dp = G.dopa > 0, pulse = beatPulse(), cl = chainLv();
  const vz = 1 + G.zp + (cl >= 2 && G.phase === 'aim' ? pulse * 0.008 * cl : 0); // ノンストップ中はビートに合わせて画面が寄る
  VZ = vz;
  if (tier >= 2 || dp) { const g = ctx.createRadialGradient(W / 2, L.cy, 40, W / 2, L.cy, H * 0.7); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(1, dp ? `hsla(${(G.t * 300) % 360},100%,60%,${0.1 + pulse * 0.12})` : `rgba(255,43,214,${0.05 + pulse * 0.08})`); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H); }
  drawWorld(); drawWorldFx();
  VZ = 1;
  if (G.phase === 'ship' || G.phase === 'rush') speedLines(0.5);
  else if (dp || tier >= 3 || cl >= 2) speedLines(Math.max(dp || tier >= 3 ? 0.22 : 0, 0.08 + cl * 0.06));
  if (cl >= 3 && G.phase === 'aim') flames(pulse, cl);
  if (dp) {
    const h = (G.t * 300) % 360; ctx.save(); ctx.fillStyle = `hsla(${h},100%,60%,0.06)`; ctx.fillRect(0, 0, W, H);
    ctx.shadowColor = `hsl(${h},100%,60%)`; ctx.shadowBlur = 30; ctx.strokeStyle = `hsl(${h},100%,60%)`; ctx.lineWidth = 6 + pulse * 4; ctx.strokeRect(-2, -2, W + 4, H + 4); ctx.restore();
  }
  drawScreenFx();
  if (G.flash > 0) { ctx.save(); ctx.globalAlpha = G.flash * 0.6; ctx.fillStyle = G.flashCol; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  VZ = vz; drawAim(); VZ = 1; // 目標はいちばん上（HUDの下）
  drawHUD();
}

// ================= 描画：結果 =================
function resultBtns() { const y = H - 84; return { retry: { x: 18, y, w: 154, h: 50 }, share: { x: W - 172, y, w: 154, h: 50 }, menu: { x: W / 2 - 60, y: H - 28, w: 120, h: 26 } }; }
function drawResult() {
  VZ = 1;
  const t = since(), R = G.res, top = 48, mh = H * 0.36;
  inkText('あなたの 日本地図', W / 2, 26, 18, INK);
  const allTrue = ISL.flatMap(I => I.P), allMy = G.my.flat();
  const F = fitBox(allTrue.concat(allMy), 16, top, W - 32, mh);
  G.cam = { x: (W / 2 - F.ox) / F.z, y: (L.cy - F.oy) / F.z, z: F.z };
  ctx.save(); ctx.globalAlpha = 0.5; drawRoses(); ctx.restore();
  drawTrueJapan(F, 'rgba(60,50,40,0.12)', 'rgba(42,36,32,0.5)', 1.2);
  const k = Math.min(1, t / 0.7), total = allMy.length; let drawn = 0;
  ctx.save(); ctx.shadowColor = NEON.pink; ctx.shadowBlur = 6;
  for (const P of G.my) {
    ctx.beginPath(); for (let i = 0; i < P.length && drawn < total * k; i++, drawn++) { const x = F.ox + P[i].x * F.z, y = F.oy + P[i].y * F.z; i ? ctx.lineTo(x, y) : ctx.moveTo(x, y); }
    ctx.strokeStyle = SHU; ctx.lineWidth = 2.2; ctx.lineJoin = 'round'; ctx.stroke();
  }
  ctx.restore();
  ctx.fillStyle = 'rgba(42,36,32,0.25)'; rrect(W - 140, top + mh - 8, 124, 20, 10); ctx.fill();
  ctx.fillStyle = 'rgba(42,36,32,0.5)'; ctx.fillRect(W - 132, top + mh + 2, 12, 2); inkText('本物', W - 116, top + mh + 2, 10, '#fff', 'left');
  ctx.fillStyle = SHU; ctx.fillRect(W - 84, top + mh + 1, 12, 3); inkText('あなた', W - 68, top + mh + 2, 10, '#fff', 'left');
  // 誤差
  const y0 = top + mh + 30, rk = t < 0.7 ? 0 : Math.min(1, (t - 0.7) / 0.5), shownErr = R.avg * (1 - Math.pow(1 - rk, 3));
  inkText('平均誤差', 40, y0, 16, INK, 'left');
  if (t > 0.7) neon(fmtKm(shownErr) + ' km', W - 30, y0, 34, R.tier <= 1 ? NEON.cyan : R.tier <= 3 ? NEON.yellow : '#ff3b3b', { align: 'right', sc: t > 1.2 && t < 1.35 ? 1.15 : 1 });
  // 忠敬の何万倍速
  if (t > 1.25) {
    const pop = Math.min(1, (t - 1.25) / 0.15);
    neon(`伊能忠敬の ${Math.round(R.speed / 1e4).toLocaleString()}万倍速!!`, W / 2, y0 + 40, 20, NEON.pink, { sc: 0.6 + pop * 0.4, rot: -0.03 });
    inkText(`忠敬 17年 → あなた ${R.el.toFixed(1)}秒`, W / 2, y0 + 63, 12, SUMI);
  }
  // 忠敬のコメント
  if (t > 1.5) {
    const pop = Math.min(1, (t - 1.5) / 0.2), iy = y0 + 116;
    ctx.save(); ctx.translate(60, iy); ctx.scale(pop, pop); ctx.translate(-60, -iy); drawIno(60, iy, 30, R.tier); ctx.restore();
    if (pop >= 1) bubble(104, iy - 6, W - 116, R.cm, 15, 90, iy + 2);
    const sy = y0 + 176;
    inkText(`PERFECT ${G.cnt[0]}/${NSEG}　コンボ ${G.maxCombo}　ノンストップ ${G.maxChain}`, W / 2, sy, 12.5, SUMI);
    inkText(`所持金 ${fmtRyo(G.score)}両　ベスト誤差 ${fmtKm(R.best.err)}km`, W / 2, sy + 19, 13, SUMI);
  }
  if (t > 1.7 && (R.nbErr || R.nbRyo)) { // 自己ベストのはんこ
    ctx.save(); ctx.translate(92, y0 - 30); ctx.rotate(-0.18); const sc = 1 + Math.max(0, 0.15 - (t - 1.7)) * 4; ctx.scale(sc, sc);
    ctx.strokeStyle = SHU; ctx.lineWidth = 2.5; ctx.fillStyle = 'rgba(255,253,246,0.85)'; rrect(-58, -15, 116, 30, 5); ctx.fill(); ctx.stroke();
    inkText(R.nbErr ? '自己ベスト更新!!' : '最高額 更新!!', 0, 1, 15, SHU); ctx.restore();
  }
  if (t > 0.6) {
    const b = resultBtns();
    ctx.fillStyle = '#fffdf6'; ctx.strokeStyle = INK; ctx.lineWidth = 2; rrect(b.retry.x, b.retry.y, b.retry.w, b.retry.h, 25); ctx.fill(); ctx.stroke();
    inkText('もう一度', b.retry.x + b.retry.w / 2, b.retry.y + b.retry.h / 2 + 1, 19, INK);
    ctx.fillStyle = DARK; ctx.save(); ctx.shadowColor = NEON.pink; ctx.shadowBlur = 12; rrect(b.share.x, b.share.y, b.share.w, b.share.h, 25); ctx.fill(); ctx.restore();
    ctx.strokeStyle = NEON.pink; ctx.lineWidth = 2; ctx.stroke();
    neon('Xでシェア', b.share.x + b.share.w / 2, b.share.y + b.share.h / 2 + 1, 18, NEON.cyan);
    inkText('タイトルへ', W / 2, b.menu.y + 13, 13, SUMI);
  }
}

function render() {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.drawImage(paperCv, 0, 0);
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  if (G.shake > 0) { const a = G.shake * 14; ctx.translate((Math.random() - 0.5) * a, (Math.random() - 0.5) * a); }
  if (G.state === 'title') drawTitle();
  else if (G.state === 'play') drawPlay();
  else drawResult();
  ctx.setTransform(DPR * S, 0, 0, DPR * S, 0, 0);
  if (G.flash > 0 && G.state !== 'play') { ctx.save(); ctx.globalAlpha = G.flash * 0.6; ctx.fillStyle = G.flashCol; ctx.fillRect(0, 0, W, H); ctx.restore(); }
  if (G.state === 'title') { ctx.fillStyle = 'rgba(29,21,48,0.75)'; ctx.beginPath(); ctx.arc(W - 20, 22, 16, 0, Math.PI * 2); ctx.fill(); drawMute(W - 20, 22); }
}

// ================= 入力 =================
const inBox = (b, x, y) => x >= b.x && x <= b.x + b.w && y >= b.y && y <= b.y + b.h;
function muteHit(x, y) {
  if (G.state === 'result' || G.phase === 'rush' && G.state === 'play') return false;
  return Math.hypot(x - L.mute.x, y - (G.state === 'title' ? 22 : L.mute.y)) < 22;
}
function share() {
  const url = /^https?:/.test(location.protocol) && location.hostname.endsWith('github.io') ? location.origin + location.pathname : URL_PUBLIC;
  const R = G.res;
  const msg = `ドパ脳忠敬で 日本を爆速測量！\n伊能忠敬の${Math.round(R.speed / 1e4).toLocaleString()}万倍速・平均誤差${fmtKm(R.avg)}km\n忠敬「${R.cm.replace(/　/g, ' ')}」\n#ドパ脳忠敬`;
  const u = 'https://twitter.com/intent/tweet?text=' + encodeURIComponent(msg) + '&url=' + encodeURIComponent(url);

}
function onPress(x, y, tt) {
  audioInit();

  if (G.state === 'title') { startRun(); return; }
  if (G.state === 'result') {
    if (since() < 0.6) { G.st = G.t - 2.0; return; } // 演出を飛ばす
    const b = resultBtns();
    if (inBox(b.share, x, y)) share(); else if (inBox(b.retry, x, y)) startRun(); else if (inBox(b.menu, x, y)) setState('title');

  }

}
function evTime(e) { const ts = e.timeStamp; return (ts > 0 && ts < 1e11 ? ts : performance.now()) / 1000; }

document.addEventListener('contextmenu', e => e.preventDefault());
document.addEventListener('gesturestart', e => e.preventDefault());
window.addEventListener('keydown', e => {
  if (e.repeat) return; audioInit();
  if (e.key === ' ' || e.key === 'Enter') { e.preventDefault(); if (G.state === 'result') { if (since() > 0.6) startRun(); } else onPress(-99, -99, evTime(e)); }
});

// ================= ループ =================
resize();
let last = performance.now();
function frame(nw) { requestAnimationFrame(frame); const dt = Math.max(0, Math.min(0.05, (nw - last) / 1000)); last = nw; update(dt); render(); }
requestAnimationFrame(frame);
if (document.fonts && document.fonts.load) { // 使う文字のフォントを先に読み込んでおく（最初の画面から正しい字で出す）
  const neonTxt = 'ドパ脳忠敬測量開始PERFECT!!GREATGOODCOMBO0123456789.,+×/km万億兆両里連覚醒超爆速音光神モード大当たりおしいハズレ金の梵天竹九十九里浜ラッシュ制覇本州へ蝦夷地四国九州日本完成時間切れ伊能倍速あなたは何？連打よーい測れタップXでシェア';
  const inkTxt = ISL.flatMap(I => I.pts.map(p => p[2])).join('') + COMMENTS.flat().join('') + INO_SAY.flat().join('') + CHAIN_SAY.join('') + 'のこり所持金あなたの日本地図平均誤差本物忠敬年秒ベスト更新最高額もう一度タイトルへビートに合わせて線が梵天竹に重なったらタップずれた分だけ日本がゆがむ自己ベスト誤差閉合ノンストップテンポ切れ…（）忠敬の故郷わしの17年、60秒で超えてみよ!!息切れか？連打じゃはやすぎるもっと速く走れい時間切れじゃ大当たりじゃあ金じゃドパミンじゃあもったいないあと少しじゃよし次じゃちと閉じとらんぞわしのコンボが';
  document.fonts.load('40px "Dela Gothic One"', neonTxt).catch(() => { }); document.fonts.load('16px "Yuji Syuku"', inkTxt).catch(() => { });
}

// テスト用（遊びには影響しません）
window.__dp = { G, L, ISL, NSEG, COMMENTS, TAP_LAG, MUS, update, tap, startRun, record, finishRun, beatTime, beatPos, now, audio: () => AC && AC.state };
})();
